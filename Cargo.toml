[package]
name = "tf3-mapgen"
version = "0.1.0"
edition = "2021"
description = "Generate Transport Fever 3 maps (heightmap, water, vegetation masks, towns) from a real-world location"
license = "MIT"

[lib]
name = "tf3_mapgen"
path = "src/lib.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", optional = true, default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
egui_kittest = "0.36"

[[bin]]
name = "tf3-mapgen"
path = "src/bin/tf3-mapgen.rs"

[[bin]]
name = "tf3-mapgen-gui"
path = "src/bin/tf3-mapgen-gui.rs"
required-features = ["gui"]

[profile.release]
lto = true
codegen-units = 1
